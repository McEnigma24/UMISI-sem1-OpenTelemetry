#   docker compose logs -f otel          # trace’y z `debug` + eksport do Jaegera
#   docker compose up --scale gateway-python=2
#   docker compose up otel               # sam Collector, klient ręcznie z hosta
#
# Obrazy: oficjalne (grafana/grafana, prom/prometheus, jaegertracing/all-in-one) — dobre wsparcie
# w dokumentacji. Docker Hardened Images (dhi/...) pod FIPS/CIS, na lokalne demo zwykle niepotrzebne.
#
# UI: Jaeger http://localhost:16686  |  Prometheus http://localhost:9090  |  Grafana http://localhost:3000 (admin/admin)
#
# HTTP pipeline: niepusty JSON ``route`` + DEMO_PEER_* (mapa hopów). Z hosta tylko gateway: localhost:18080.
# Stub traffic_generator: `docker compose run --rm traffic_generator` lub `DEMO_PAYLOAD_FILE` z przykładowym route.
#
services:

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel:
    build:
      context: ./server/otel
    image: server_otel
    ports:
      - "4317:4317"
      - "4318:4318"
    # 8889 tylko w sieci Dockera (Prometheus skrapuje otel:8889)
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./server/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./server/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
      - jaeger

  # workers #
  # client-cpp:
  #   build:
  #     context: ./clients/cpp
  #   image: client_cpp
  #   volumes:
  #     - ./clients/cpp/build-docker:/app/build
  #   environment:
  #     OTEL_DEMO_TRACE_EXPORT: otlp
  #     OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
  #     OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
  #     OTEL_ENVIRONMENT: local
  #     OTEL_DEMO_RESOURCE_TAG: lang-cpp
  #     DEMO_HTTP_ADDR: 0.0.0.0:8080
  #     DEMO_HTTP_PATH: /v1/pipeline
  #     DEMO_CLIENT_ID: cpp
  #     DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
  #     DEMO_PEER_RS: http://client-rust:8080/v1/pipeline
  #     DEMO_PEER_CS: http://client-csharp:8080/v1/pipeline
  #   depends_on:
  #     otel:
  #       condition: service_started

  # Rust: najpierw `cd clients/rust && ./docker_build` → docker-target/release na dysku;
  # potem docker compose build (runner = COPY binarki, jak cpp).
  client-rust:
    build:
      context: ./clients/rust
      dockerfile: Dockerfile
      target: runner
    image: client_rust
    environment:
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-rust
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_CLIENT_ID: rs
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://client-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://client-csharp:8080/v1/pipeline
    depends_on:
      otel:
        condition: service_started

  client-csharp:
    build:
      context: ./clients/csharp
    image: client_csharp
    environment:
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-csharp
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_CLIENT_ID: cs
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://client-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://client-csharp:8080/v1/pipeline
    depends_on:
      otel:
        condition: service_started

  # API gateway #
  gateway-python:
    build:
      context: ./clients/python
    image: client_python
    ports:
      - "18080:8080"
    environment:
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-python
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_CLIENT_ID: py
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://client-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://client-csharp:8080/v1/pipeline
    depends_on:
      otel:
        condition: service_started
      # client-cpp:
      #   condition: service_started
      client-rust:
        condition: service_started
      client-csharp:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s



  # Traffic Generator #
  traffic_generator:
    build:
      context: ./stub/sender/python_traffic_generator
    image: traffic_generator
    environment:
      DEMO_TARGET_URL: http://gateway-python:8080/v1/pipeline

      # DEMO_PAYLOAD_FILE: /app/routes/1-scenario.json
      DEMO_SCENARIO_FILE: /app/scenarios/1-scenario-sequential.json
      # DEMO_SCENARIO_FILE: /app/scenarios/2-scenario-parallel.json
    depends_on:
      gateway-python:
        condition: service_healthy





  # client-cpp:
  #   build:
  #     context: ./clients/cpp
  #   image: client_cpp
  #   volumes:
  #     - ./clients/cpp/build-docker:/app/build
  #   environment:
  #     OTEL_DEMO_TRACE_EXPORT: otlp
  #     OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
  #   command:
  #     - /bin/sh
  #     - -c
  #     - "sleep 6 && exec ./Docker_start.sh"
  #   depends_on:
  #     otel:
  #       condition: service_started





