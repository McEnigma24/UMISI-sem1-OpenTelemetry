  # API gateway #
  gateway-python:
    build:
      context: ./workers/python
    image: worker_python
    ports:
      # Mapowanie na hosta (domyślnie nasłuch na 0.0.0.0 — dostęp z LAN: http://<IP_hosta>:18080)
      - "18080:8080"
    environment:
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_DEMO_LOG_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel:4318/v1/logs
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-python
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_WORKER_ID: py
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://worker-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://worker-csharp:8080/v1/pipeline
      DEMO_PEER_GO: http://worker-go:8080/v1/pipeline
      DEMO_PEER_JA: http://worker-java:8080/v1/pipeline
      OTEL_SERVICE_NAME: gateway_python
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      PYROSCOPE_SERVER: http://pyroscope:4040
    depends_on:
      otel:
        condition: service_started
      pyroscope:
        condition: service_started
      worker-java:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s



