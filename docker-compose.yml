#   docker compose logs -f otel          # trace’y z `debug` + eksport do Jaegera + Tempo (Grafana Drilldown)
#   docker compose up --scale gateway-python=2
#   docker compose up otel               # sam Collector, ręczne wywołania z hosta
#
# Obrazy: oficjalne (grafana/grafana, prom/prometheus, jaegertracing/all-in-one) — dobre wsparcie
# w dokumentacji. Docker Hardened Images (dhi/...) pod FIPS/CIS, na lokalne demo zwykle niepotrzebne.
#
# UI: Jaeger http://localhost:16686  |  Prometheus http://localhost:9090  |  Grafana http://localhost:3000
#       (lokalne demo: Grafana z anonimowym Admin — bez logowania; nie wystawiaj portu 3000 na internet).
#       Pyroscope http://localhost:4040  — profiling pod Trace→profiles / flame graph w szczegółach spanu (wymaga pyroscope.profile.id na spanach).
# Trace’y w Grafanie (Drilldown / Explore): wybierz datasource **Tempo** — Jaeger UI nadal pod :16686.
# Ten sam ``trace_id`` trafia do Jaegera i Tempo (Collector → oba). Porównanie dwóch trace’ów jak w Jaegerze „Compare”:
#   Jaeger UI → Search → wybierz trace A → Compare → wklej ID trace B. W Grafanie brak natywnego diffu dwóch ID —
#   Explore → ikona split → w każdym panelu Tempo i inne ``trace_id``; wizualnie porównujesz waterfall/minimapę.
#
# HTTP pipeline: niepusty JSON ``route`` + DEMO_PEER_* (mapa hopów). Z hosta gateway: http://127.0.0.1:18080
# (POST /v1/pipeline; ``localhost`` bywa IPv6 — lepiej 127.0.0.1). Diagnoza: ``docker compose ps``, logi
# ``gateway-python`` / ``worker-csharp`` / ``worker-rust`` / ``worker-go`` / ``worker-java``; pierwsze sekundy po starcie workery mogą jeszcze nie forwardować.
# ``worker-java`` ma healthcheck; workery z ``DEMO_PEER_JA`` czekają na ``service_healthy`` — inaczej Go/Rust/C#/gateway
#   mogą dostać ``lookup worker-java … i/o timeout`` (DNS 127.0.0.11) przy pierwszym hopie do workera Java (``DEMO_WORKER_ID=ja``).
# Nie ustawiaj ``dns_opt: use-vc`` na tych serwisach: embedded DNS Dockera potrafi wtedy zwracać ``invalid DNS response``.
# Pyroscope push (log startowy ten sam): Python ``pyroscope-io``, Rust ``pyroscope``, Go ``pyroscope-go``, Node ``@pyroscope/nodejs``.
# C# — bez wbudowanego push CPU (profiler natywny wymaga osobnego obrazu / zmiennych CORECLR_*); tylko spójny komunikat + ``PYROSCOPE_SERVER``.
# Stub traffic_generator: compose lub ręcznie: cd stub/sender/python_traffic_generator && ./docker_run.sh
#
services:

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Tempo: backend pod Grafana „Drilldown / Traces” (Jaeger datasource tego nie obsługuje).
  tempo-init:
    image: busybox:1.36
    user: root
    volumes:
      - tempo-data:/var/tempo
    entrypoint:
      - /bin/sh
      - -c
      - chown -R 10001:10001 /var/tempo

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./server/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  otel:
    build:
      context: ./server/otel
    image: server_otel
    ports:
      - "4317:4317"
      - "4318:4318"
    # 8889 tylko w sieci Dockera (Prometheus skrapuje otel:8889)
    depends_on:
      jaeger:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Tempo metrics_generator (span metrics) → remote_write; bez tego TraceQL ``| rate()`` w Drilldown → „empty ring”
      - --web.enable-remote-write-receiver
    volumes:
      - ./server/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      otel:
        condition: service_started

  # Profiling (Grafana Pyroscope). Drilldown „Profiles / Diff flame graph” = dwa zakresy czasu profilu CPU
  #   (continuous profiling), nie porównanie dwóch trace_id. ``gateway-python``, ``worker-rust``, ``worker-go``, ``worker-java``, ``worker-nodejs`` (profil ``nodejs``) wysyłają push
  #   profili (PYROSCOPE_SERVER); C# — brak push profilu CPU w tym obrazie (profiler .NET osobno). Trace→span profil: ``pyroscope.profile.id`` osobno.
  # Dok.: https://grafana.com/docs/pyroscope/latest/configure-client/
  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "4040:4040"
    # Brak wolumenu: demo; profile znikają po restarcie kontenera.

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Lokalne demo: wejście bez formularza logowania (anon = Admin). Produkcja: usuń te trzy + dodaj auth.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Trace → profile: przycisk „Profiles for this span” + tracesEmbeddedFlameGraph (szczegóły spanu).
      # Lista: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/feature-toggles/
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles tracesEmbeddedFlameGraph
    volumes:
      - ./server/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
      - jaeger
      - tempo
      - pyroscope

  # workers #
  # worker-cpp:
  #   build:
  #     context: ./workers/cpp
  #   image: worker_cpp
  #   volumes:
  #     - ./workers/cpp/build-docker:/app/build
  #   environment:
  #     OTEL_DEMO_TRACE_EXPORT: otlp
  #     OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
  #     OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
  #     OTEL_ENVIRONMENT: local
  #     OTEL_DEMO_RESOURCE_TAG: lang-cpp
  #     DEMO_HTTP_ADDR: 0.0.0.0:8080
  #     DEMO_HTTP_PATH: /v1/pipeline
  #     DEMO_WORKER_ID: cpp
  #     DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
  #     DEMO_PEER_RS: http://worker-rust:8080/v1/pipeline
  #     DEMO_PEER_CS: http://worker-csharp:8080/v1/pipeline
  #   depends_on:
  #     otel:
  #       condition: service_started

  # Rust / C# / Go: najpierw `./compose_build.sh` (volume → docker-target / publish-docker), potem runner w compose.
  # Java: `docker compose build worker-java` z `workers/java` (Maven shade w Dockerfile). Node.js: profil ``nodejs`` — ``docker compose --profile nodejs build worker-nodejs``.
  worker-rust:
    build:
      context: ./workers/rust
      dockerfile: Dockerfile
      target: runner
    image: worker_rust
    environment:
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_DEMO_LOG_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel:4318/v1/logs
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-rust
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_WORKER_ID: rs
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://worker-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://worker-csharp:8080/v1/pipeline
      DEMO_PEER_GO: http://worker-go:8080/v1/pipeline
      DEMO_PEER_JA: http://worker-java:8080/v1/pipeline
      OTEL_SERVICE_NAME: worker_rust
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      PYROSCOPE_SERVER: http://pyroscope:4040
    depends_on:
      otel:
        condition: service_started
      pyroscope:
        condition: service_started
      worker-java:
        condition: service_healthy

  # C#: jak Rust / Go — najpierw `./compose_build.sh` (builder + volumen → publish-docker na hoście).
  worker-csharp:
    build:
      context: ./workers/csharp
      dockerfile: Dockerfile
      target: runner
    image: worker_csharp
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_DEMO_LOG_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel:4318/v1/logs
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-csharp
      OTEL_SERVICE_NAME: worker_csharp
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_WORKER_ID: cs
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://worker-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://worker-csharp:8080/v1/pipeline
      DEMO_PEER_GO: http://worker-go:8080/v1/pipeline
      DEMO_PEER_JA: http://worker-java:8080/v1/pipeline
      PYROSCOPE_SERVER: http://pyroscope:4040
    depends_on:
      otel:
        condition: service_started
      pyroscope:
        condition: service_started
      worker-java:
        condition: service_healthy

  worker-go:
    build:
      context: ./workers/go
      dockerfile: Dockerfile
      target: runner
    image: worker_go
    environment:
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_DEMO_LOG_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel:4318/v1/logs
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-go
      OTEL_SERVICE_NAME: worker_go
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_WORKER_ID: go
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://worker-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://worker-csharp:8080/v1/pipeline
      DEMO_PEER_GO: http://worker-go:8080/v1/pipeline
      DEMO_PEER_JA: http://worker-java:8080/v1/pipeline
      PYROSCOPE_SERVER: http://pyroscope:4040
    depends_on:
      otel:
        condition: service_started
      pyroscope:
        condition: service_started
      worker-java:
        condition: service_healthy

  worker-java:
    build:
      context: ./workers/java
      dockerfile: Dockerfile
    image: worker_java
    environment:
      OTEL_DEMO_TRACE_EXPORT: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_ENVIRONMENT: local
      OTEL_DEMO_RESOURCE_TAG: lang-java
      OTEL_SERVICE_NAME: worker_java
      PYROSCOPE_SERVER: http://pyroscope:4040
      DEMO_HTTP_ADDR: 0.0.0.0:8080
      DEMO_HTTP_PATH: /v1/pipeline
      DEMO_WORKER_ID: ja
      DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
      DEMO_PEER_RS: http://worker-rust:8080/v1/pipeline
      DEMO_PEER_CS: http://worker-csharp:8080/v1/pipeline
      DEMO_PEER_GO: http://worker-go:8080/v1/pipeline
      DEMO_PEER_JA: http://worker-java:8080/v1/pipeline
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3<&-"]
      interval: 3s
      timeout: 5s
      retries: 8
      start_period: 45s
    depends_on:
      otel:
        condition: service_started
      pyroscope:
        condition: service_started

  # worker-nodejs:
  #   profiles:
  #     - nodejs
  #   build:
  #     context: ./workers/nodejs
  #     dockerfile: Dockerfile
  #     target: runner
