  #     DEMO_HTTP_ADDR: 0.0.0.0:8080
  #     DEMO_HTTP_PATH: /v1/pipeline
  #     DEMO_WORKER_ID: js
  #     DEMO_PEER_PY: http://gateway-python:8080/v1/pipeline
  #     DEMO_PEER_RS: http://worker-rust:8080/v1/pipeline
  #     DEMO_PEER_CS: http://worker-csharp:8080/v1/pipeline
