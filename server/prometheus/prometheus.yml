# Tylko metryki: Prometheus skrapuje OpenTelemetry Collectora (eksporter prometheus :8889).
# Jaeger NIE jest targetem w Prometheusie — trace’y idą: klienci → otel (OTLP) → Jaeger.
# UI Jaegera: http://localhost:16686
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel:8889]
