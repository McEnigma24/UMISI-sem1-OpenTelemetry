# OpenTelemetry Collector (contrib) — OTLP, trace’y: Jaeger (OTLP) + logi: debug; metryki: endpoint do scrapu Prometheusa
# Klienci: 4317 gRPC, 4318 HTTP. Prometheus w Compose skrapuje: otel:8889
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed
  # Jaeger all-in-one: odbiornik OTLP gRPC (sieć Docker: host jaeger, port 4317)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
